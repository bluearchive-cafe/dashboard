<!DOCTYPE html>
<html lang="zh-CN" class="mdui-theme-auto">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512">
    <title>蔚蓝咖啡厅 - 资源控制面板</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2ELMBHNMZX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-2ELMBHNMZX');
    </script>

    <!-- Vite entry module (CSS and JS bundled together) -->
    <script type="module" src="/src/main.js"></script>
</head>

<body>
    <div class="page-background" aria-hidden="true">
        <img src="/assets/images/background.webp" alt="">
    </div>
    <div class="page-overlay" aria-hidden="true"></div>
    <div class="shell">
        <section class="hero mdui-shadow-0" aria-labelledby="hero-heading">
            <div class="hero-copy">
                <div class="hero-heading" id="hero-heading">
                    <div class="mdui-typo">
                        <h1 class="mdui-text-color-on-surface hero-title">蔚蓝咖啡厅控制面板</h1>
                        <p class="mdui-text-color-on-surface-variant hero-description">先查看各项状态，再按需切换开关并保存设置。</p>
                    </div>
                </div>
            </div>

            <div class="feature-list" role="list">
                <!-- 游戏文本 -->
                <div class="feature-item" role="listitem">
                    <div class="feature-title">
                        <strong id="label-text">游戏文本</strong>
                        <span id="desc-text">控制文本汉化启用状态</span>
                    </div>
                    <mdui-chip id="text-status" class="feature-status" variant="assist" elevated>
                        <span class="status-content">
                            <span class="ui-icon status-icon-loading" aria-hidden="true"></span>
                            <span class="status-label">加载中</span>
                        </span>
                    </mdui-chip>
                    <mdui-checkbox id="text-checkbox" aria-labelledby="label-text" aria-describedby="desc-text"></mdui-checkbox>
                </div>

                <!-- 主线中配 -->
                <div class="feature-item" role="listitem">
                    <div class="feature-title">
                        <strong id="label-voice">主线中配</strong>
                        <span id="desc-voice">控制主线故事中文配音</span>
                    </div>
                    <mdui-chip id="voice-status" class="feature-status" variant="assist" elevated>
                        <span class="status-content">
                            <span class="ui-icon status-icon-loading" aria-hidden="true"></span>
                            <span class="status-label">加载中</span>
                        </span>
                    </mdui-chip>
                    <mdui-checkbox id="voice-checkbox" aria-labelledby="label-voice" aria-describedby="desc-voice"></mdui-checkbox>
                </div>

                <!-- 图像视频 -->
                <div class="feature-item" role="listitem">
                    <div class="feature-title">
                        <strong id="label-media">图像视频</strong>
                        <span id="desc-media">控制媒体资源汉化开关</span>
                    </div>
                    <mdui-chip id="media-status" class="feature-status" variant="assist" elevated>
                        <span class="status-content">
                            <span class="ui-icon status-icon-loading" aria-hidden="true"></span>
                            <span class="status-label">加载中</span>
                        </span>
                    </mdui-chip>
                    <mdui-checkbox id="media-checkbox" aria-labelledby="label-media" aria-describedby="desc-media"></mdui-checkbox>
                </div>
            </div>
            <div id="status-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
        </section>

        <div class="actions">
            <mdui-button id="save-button" variant="filled">
                <span class="action-content">
                    <span class="ui-icon action-icon-save" aria-hidden="true"></span>
                    <span>保存设置</span>
                </span>
            </mdui-button>
            <mdui-button id="read-button" variant="tonal">
                <span class="action-content">
                    <span class="ui-icon action-icon-help" aria-hidden="true"></span>
                    <span>查看说明</span>
                </span>
            </mdui-button>
            <mdui-button id="copy-button" variant="outlined">
                <span class="action-content">
                    <span class="ui-icon action-icon-copy-link" aria-hidden="true"></span>
                    <span>复制链接</span>
                </span>
            </mdui-button>
            <mdui-button id="diagnose-button" variant="outlined">
                <span class="action-content">
                    <span class="ui-icon action-icon-diagnose" aria-hidden="true"></span>
                    <span>诊断信息</span>
                </span>
            </mdui-button>
        </div>

        <footer class="page-footer" role="contentinfo">
            Copyright &copy; 2026 蔚蓝咖啡厅. All rights reserved.<br>
            使用 MDUI 构建 | <span id="webui-version"></span> | Developer: roundRekt, KFACBT
        </footer>
    </div>
</body>

</html>
